name: Validate Language Files

on:
  push:
    paths: ['languages/**', 'scripts/validate-languages.mjs']
  pull_request:
    paths: ['languages/**', 'scripts/validate-languages.mjs']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: node scripts/validate-languages.mjs
