name: Validate Language Files

on:
  push:
    paths: ['languages/**', 'scripts/validate-languages.mjs']
  pull_request:
    paths: ['languages/**', 'scripts/validate-languages.mjs']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-languages.mjs
