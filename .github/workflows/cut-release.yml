name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to cut (e.g. 1.5.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Need a token that can push commits and tags.
          fetch-depth: 0

      - name: Guard ref and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: $VERSION"
            exit 1
          fi
          if [[ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]]; then
            echo "Must run against main (got $(git rev-parse --abbrev-ref HEAD))"
            exit 1
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree is dirty"
            git status
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Bump, stamp suite, build zip
        id: cut
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node scripts/cut-release.mjs "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=freetext-conformance-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Validate
        run: npm run validate

      - name: Commit release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json MECP_Comprehensive_Brief.md CHANGELOG.md freetext/manifest.json
          git commit -m "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "MECP v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ZIP: ${{ steps.cut.outputs.zip }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "$ZIP" \
            --title "v${VERSION}" \
            --notes-file .release-notes.md
