name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly self-validate (bitrot / runner drift); not a client matrix.
    - cron: '0 15 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run validate
